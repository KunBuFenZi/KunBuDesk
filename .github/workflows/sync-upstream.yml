name: Sync official stable RustDesk
'on':
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-official-stable
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - name: Check latest stable release and validate changes
      id: sync
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/sync_upstream.py
    - name: Test updated recipes
      if: steps.sync.outputs.changed == 'true'
      run: python -m unittest discover -s tests -v
    - name: Commit validated upstream update
      if: steps.sync.outputs.changed == 'true'
      env:
        UPSTREAM_TAG: ${{ steps.sync.outputs.tag }}
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add upstream

        git commit -m "chore: sync official RustDesk $UPSTREAM_TAG"

        git push

        '
    - name: Sync summary
      if: ${{ always() }}
      env:
        SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
        SYNC_TAG: ${{ steps.sync.outputs.tag }}
      run: python scripts/sync_summary.py
