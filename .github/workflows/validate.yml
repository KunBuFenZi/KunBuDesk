name: Validate builder
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - name: Verify maintained JavaScript Action runtime
      uses: actions/github-script@v9
      with:
        script: |
          if (Number(process.versions.node.split('.')[0]) < 24) {
            throw new Error('Build Actions require Node.js 24 or later');
          }
          core.info(`Action runtime: Node.js ${process.versions.node}`);
    - name: Verify maintained cache Action
      uses: actions/cache@v6
      with:
        path: .generated/action-cache-smoke
        key: ${{ runner.os }}-builder-action-cache-smoke-v1
    - run: |
        mkdir -p .generated/action-cache-smoke
        echo runtime-cache-ok > .generated/action-cache-smoke/check.txt
    - run: python -m unittest discover -s tests -v
    - name: Validate recipes and real upstream source patches
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/validate.py --lint-directory .generated/lint
    - name: Install actionlint
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/install_actionlint.py
    - name: Lint orchestration and every generated upstream action
      run: .generated/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml .generated/lint/*.yml
    - name: Generate a local composite smoke test
      run: python scripts/composite_smoke.py
    - name: Verify runtime-generated local action support
      uses: ./.generated/smoke
      env:
        CB_SMOKE: runtime-action-ok
  android-signing:
    name: Verify fixed Android release certificate
    if: ${{ github.event_name != 'pull_request' && github.repository == 'KunBuFenZi/KunBuDesk' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - name: Verify private client defaults are available and masked
      env:
        CB_DEFAULT_APP_NAME: ${{ secrets.CLIENT_APP_NAME }}
        CB_DEFAULT_ID_SERVER: ${{ secrets.CLIENT_ID_SERVER }}
        CB_DEFAULT_RELAY_SERVER: ${{ secrets.CLIENT_RELAY_SERVER }}
        CB_DEFAULT_API_SERVER: ${{ secrets.CLIENT_API_SERVER }}
        CB_DEFAULT_KEY: ${{ secrets.CLIENT_KEY }}
      run: python scripts/client_config.py
    - name: Sign and verify temporary test APK with the fixed release key
      env:
        CB_SECRET_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        CB_SECRET_ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        CB_SECRET_ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        CB_SECRET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: python scripts/android_signing_smoke.py
