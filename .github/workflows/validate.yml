name: Validate builder
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest discover -s tests -v
    - name: Validate recipes and real upstream source patches
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/validate.py --lint-directory .generated/lint
    - name: Install actionlint
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/install_actionlint.py
    - name: Lint orchestration and every generated upstream action
      run: .generated/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml .generated/lint/*.yml
    - name: Generate a local composite smoke test
      run: python scripts/composite_smoke.py
    - name: Verify runtime-generated local action support
      uses: ./.generated/smoke
      env:
        CB_SMOKE: runtime-action-ok
  android-signing:
    name: Verify fixed Android release certificate
    if: ${{ github.event_name != 'pull_request' && github.repository == 'KunBuFenZi/KunBuDesk' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - name: Sign and verify temporary test APK with the fixed release key
      env:
        CB_SECRET_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        CB_SECRET_ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        CB_SECRET_ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        CB_SECRET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: python scripts/android_signing_smoke.py
