      with:
        repository: rustdesk/rustdesk
        ref: ${{ needs.prepare.outputs.commit }}
        submodules: recursive
        persist-credentials: false
    - name: Checkout this builder
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.sha }}
        path: .custom-builder
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install recipe parser
      shell: bash
      run: python -m pip install -r .custom-builder/requirements.txt
    - name: Apply client defaults and prepare official build steps
      shell: bash
      run: python .custom-builder/scripts/stage.py topmost
    - name: Build with official RustDesk steps
      uses: ./.custom-builder/.generated/action
  windows:
    name: windows · ${{ matrix.job.arch || matrix.job.artifact-name }}
    needs:
    - prepare
    - bridge
    - topmost
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.windows_enabled == 'true' && needs.bridge.result
      == 'success' && needs.topmost.result == 'success' }}
