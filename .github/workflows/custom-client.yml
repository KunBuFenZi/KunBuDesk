# Static orchestration; official recipes are loaded at runtime from upstream/.
name: Build custom RustDesk
run-name: "Custom RustDesk \xB7 ${{ inputs.platform }} \xB7 ${{ inputs.arch }} \xB7 #${{ github.run_number }}"
'on':
  workflow_dispatch:
    inputs:
      platform:
        description: "\u7F16\u8BD1\u5E73\u53F0\uFF08Linux \u9ED8\u8BA4\u5305\u542B x64 Wayland \u5B9E\u9A8C\u7248\uFF09"
        type: choice
        default: all
        options:
        - all
        - windows
        - linux
        - linux-wayland
        - macos
        - android
      arch:
        description: "\u67B6\u6784\uFF1Ball \u7F16\u8BD1\u6240\u9009\u5E73\u53F0\u7684\u5168\u90E8\u652F\u6301\u67B6\u6784"
        type: choice
        default: all
        options:
        - all
        - x86_64
        - arm64
        - x86
        - armv7
permissions:
  contents: read
jobs:
  prepare:
    name: Validate config and select targets
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
      bridge_enabled: ${{ steps.prepare.outputs.bridge_enabled }}
      bridge_matrix: ${{ steps.prepare.outputs.bridge_matrix }}
      topmost_enabled: ${{ steps.prepare.outputs.topmost_enabled }}
      topmost_matrix: ${{ steps.prepare.outputs.topmost_matrix }}
      windows_enabled: ${{ steps.prepare.outputs.windows_enabled }}
      windows_matrix: ${{ steps.prepare.outputs.windows_matrix }}
      windows_legacy_enabled: ${{ steps.prepare.outputs.windows_legacy_enabled }}
      windows_legacy_matrix: ${{ steps.prepare.outputs.windows_legacy_matrix }}
      macos_enabled: ${{ steps.prepare.outputs.macos_enabled }}
      macos_matrix: ${{ steps.prepare.outputs.macos_matrix }}
      android_enabled: ${{ steps.prepare.outputs.android_enabled }}
      android_matrix: ${{ steps.prepare.outputs.android_matrix }}
      android_universal_enabled: ${{ steps.prepare.outputs.android_universal_enabled }}
      android_universal_matrix: ${{ steps.prepare.outputs.android_universal_matrix }}
      linux_enabled: ${{ steps.prepare.outputs.linux_enabled }}
      linux_matrix: ${{ steps.prepare.outputs.linux_matrix }}
      linux_legacy_enabled: ${{ steps.prepare.outputs.linux_legacy_enabled }}
      linux_legacy_matrix: ${{ steps.prepare.outputs.linux_legacy_matrix }}
      appimage_enabled: ${{ steps.prepare.outputs.appimage_enabled }}
      appimage_matrix: ${{ steps.prepare.outputs.appimage_matrix }}
      linux_wayland_enabled: ${{ steps.prepare.outputs.linux_wayland_enabled }}
      linux_wayland_matrix: ${{ steps.prepare.outputs.linux_wayland_matrix }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - id: prepare
      env:
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_ARCH: ${{ inputs.arch }}
        CB_SECRET_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        CB_SECRET_ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        CB_SECRET_ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        CB_SECRET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        CB_DEFAULT_APP_NAME: ${{ secrets.CLIENT_APP_NAME }}
        CB_DEFAULT_ID_SERVER: ${{ secrets.CLIENT_ID_SERVER }}
        CB_DEFAULT_RELAY_SERVER: ${{ secrets.CLIENT_RELAY_SERVER }}
        CB_DEFAULT_API_SERVER: ${{ secrets.CLIENT_API_SERVER }}
        CB_DEFAULT_KEY: ${{ secrets.CLIENT_KEY }}
        CB_ARCHIVE_PASSWORD: ${{ secrets.ARTIFACT_ZIP_PASSWORD }}
      run: python scripts/prepare.py
  source:
    name: Archive corresponding source
    needs:
    - prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - name: Checkout pinned official RustDesk
      uses: actions/checkout@v7
      with:
        repository: rustdesk/rustdesk
        ref: ${{ needs.prepare.outputs.commit }}
        submodules: recursive
        persist-credentials: false
    - name: Checkout this builder
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: .custom-builder
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install recipe parser
      shell: bash
      run: python -m pip install -r .custom-builder/requirements.txt
    - name: Load private client defaults from Secrets
      shell: bash
      env:
        CB_DEFAULT_APP_NAME: ${{ secrets.CLIENT_APP_NAME }}
        CB_DEFAULT_ID_SERVER: ${{ secrets.CLIENT_ID_SERVER }}
        CB_DEFAULT_RELAY_SERVER: ${{ secrets.CLIENT_RELAY_SERVER }}
        CB_DEFAULT_API_SERVER: ${{ secrets.CLIENT_API_SERVER }}
        CB_DEFAULT_KEY: ${{ secrets.CLIENT_KEY }}
      run: python .custom-builder/scripts/client_config.py
    - run: python .custom-builder/scripts/source_archive.py
    - name: Encrypt download with repository Secret
      shell: bash
      env:
        CB_ARCHIVE_PASSWORD: ${{ secrets.ARTIFACT_ZIP_PASSWORD }}
        CB_ARCHIVE_OUTPUT: .custom-builder/encrypted/client-corresponding-source.zip
      run: python .custom-builder/scripts/artifact_zip.py seal --input .custom-builder/dist --output "$CB_ARCHIVE_OUTPUT"
    - uses: actions/upload-artifact@v7
      with:
        name: client-corresponding-source
        path: .custom-builder/encrypted/*.zip
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
  bridge:
    name: "bridge \xB7 ${{ matrix.job.arch || matrix.job.artifact-name }}"
    needs:
    - prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.bridge_enabled == 'true' }}
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.bridge_matrix) }}
    env:
      BUILD_MATRIX_JSON: ${{ toJSON(matrix.job) }}
    steps:
    - name: Checkout pinned official RustDesk
      uses: actions/checkout@v7
      with:
        repository: rustdesk/rustdesk
        ref: ${{ needs.prepare.outputs.commit }}
        submodules: recursive
        persist-credentials: false
    - name: Checkout this builder
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: .custom-builder
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install recipe parser
      shell: bash
      run: python -m pip install -r .custom-builder/requirements.txt
    - name: Load private client defaults from Secrets
      shell: bash
      env:
        CB_DEFAULT_APP_NAME: ${{ secrets.CLIENT_APP_NAME }}
        CB_DEFAULT_ID_SERVER: ${{ secrets.CLIENT_ID_SERVER }}
        CB_DEFAULT_RELAY_SERVER: ${{ secrets.CLIENT_RELAY_SERVER }}
        CB_DEFAULT_API_SERVER: ${{ secrets.CLIENT_API_SERVER }}
        CB_DEFAULT_KEY: ${{ secrets.CLIENT_KEY }}
      run: python .custom-builder/scripts/client_config.py
    - name: Apply client defaults and prepare official build steps
      shell: bash
      run: python .custom-builder/scripts/stage.py bridge
    - name: Build with official RustDesk steps
      uses: ./.custom-builder/.generated/action
  topmost:
    name: "topmost \xB7 ${{ matrix.job.arch || matrix.job.artifact-name }}"
    needs:
    - prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.topmost_enabled == 'true' }}
    runs-on: ${{ matrix.job.target }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.topmost_matrix) }}
    env:
      BUILD_MATRIX_JSON: ${{ toJSON(matrix.job) }}
    steps:
