      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: client-appimage-${{ matrix.job.arch }}
        path: .custom-builder/dist/
        if-no-files-found: error
        retention-days: 30
  summary:
    name: Build summary
    needs:
    - prepare
    - source
    - bridge
    - topmost
    - windows
    - windows_legacy
    - macos
    - android
    - android_universal
    - linux
    - linux_legacy
    - appimage
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - env:
        JOB_RESULTS_JSON: ${{ toJSON(needs) }}
      run: python scripts/summary.py
