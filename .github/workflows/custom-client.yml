      uses: ./.custom-builder/.generated/action
  windows:
    name: "windows \xB7 ${{ matrix.job.arch || matrix.job.artifact-name }}"
    needs:
    - prepare
    - bridge
    - topmost
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.windows_enabled == 'true' && needs.bridge.result
      == 'success' && needs.topmost.result == 'success' }}
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 180
    strategy:
